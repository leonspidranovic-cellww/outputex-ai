<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OUTPUTEX AI 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & BASE ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0b0f;
            --bg-secondary: #14141a;
            --bg-card: #1c1c26;
            --bg-input: #242430;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a82;
            --border-color: #2a2a3a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            /* theme color (default: blue) */
            --theme: #4a8eff;
            --theme-rgb: 74, 142, 255;
            --theme-glow: rgba(74, 142, 255, 0.25);
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--theme);
            border-radius: 8px;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 20px;
            background: var(--bg-primary);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--theme);
            transition: color var(--transition);
            user-select: none;
        }

        .brand span {
            font-weight: 400;
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            position: relative;
        }

        .header-btn:hover {
            background: var(--bg-input);
            color: var(--text-primary);
            transform: scale(1.05);
        }

        .header-btn:active {
            transform: scale(0.94);
        }

        .header-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--theme);
            box-shadow: 0 0 8px var(--theme-glow);
            transition: background var(--transition);
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }

        .greeting-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 0 40px;
            animation: fadeUp 0.6s ease-out;
        }

        .greeting-center .logo-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--theme);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 0 60px var(--theme-glow), 0 0 120px var(--theme-glow);
            transition: all var(--transition);
            margin-bottom: 28px;
            position: relative;
            user-select: none;
        }

        .greeting-center .logo-ring::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--theme);
            opacity: 0.3;
            animation: pulseRing 2.4s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.7;
            }
        }

        .greeting-center .greeting-title {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .greeting-center .greeting-sub {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 440px;
            line-height: 1.6;
        }

        .greeting-center .greeting-sub strong {
            color: var(--theme);
            font-weight: 600;
            transition: color var(--transition);
        }

        .greeting-center .today-badge {
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            letter-spacing: 0.3px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            display: flex;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            animation: slideIn 0.35s ease-out;
            max-width: 88%;
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .message.assistant {
            background: transparent;
            border: none;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: var(--theme);
            transition: background var(--transition);
        }

        .message.user .avatar {
            background: var(--bg-input);
            color: var(--text-secondary);
        }

        .message .bubble {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--text-primary);
            word-break: break-word;
            padding-top: 4px;
        }

        .message .bubble .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .message .bubble .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .message .bubble .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .message .bubble .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotBounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .input-area {
            padding: 14px 0 20px;
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 6px 6px 6px 16px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .input-row:focus-within {
            border-color: var(--theme);
            box-shadow: 0 0 0 4px var(--theme-glow);
        }

        .input-row textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14.5px;
            font-family: 'Inter', sans-serif;
            resize: none;
            padding: 10px 0;
            max-height: 120px;
            line-height: 1.5;
            min-height: 22px;
        }

        .input-row textarea::placeholder {
            color: var(--text-muted);
        }

        .input-row .send-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--theme);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .input-row .send-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 24px var(--theme-glow);
        }

        .input-row .send-btn:active {
            transform: scale(0.92);
        }

        .input-row .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar .toggle-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 4px;
            border: 1px solid var(--border-color);
        }

        .toolbar .toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px 5px 10px;
            border: none;
            border-radius: 16px;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .toolbar .toggle-btn .icon {
            font-size: 16px;
            line-height: 1;
        }

        .toolbar .toggle-btn.active {
            background: var(--theme);
            color: #fff;
            box-shadow: 0 0 20px var(--theme-glow);
        }

        .toolbar .toggle-btn:not(.active):hover {
            color: var(--text-primary);
            background: var(--bg-input);
        }

        .toolbar .action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 14px 5px 10px;
            border: none;
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
            border: 1px solid var(--border-color);
        }

        .toolbar .action-btn:hover {
            background: var(--bg-input);
            color: var(--text-primary);
            border-color: var(--theme);
        }

        .toolbar .action-btn .icon {
            font-size: 16px;
        }

        /* ----- MODALS (общие) ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 32px 36px 28px;
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            box-shadow: var(--shadow);
            transform: scale(0.92) translateY(12px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.open .modal {
            transform: scale(1) translateY(0);
        }

        .modal h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .modal .modal-sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .modal .modal-close {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: 'Inter', sans-serif;
            margin-top: 12px;
        }

        .modal .modal-close:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }

        /* ----- Настройки цвета ----- */
        .modal .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .modal .color-swatch {
            aspect-ratio: 1;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }

        .modal .color-swatch:hover {
            transform: scale(1.08);
        }

        .modal .color-swatch.active {
            border-color: #fff;
            box-shadow: 0 0 0 3px var(--bg-primary), 0 0 0 5px var(--theme);
        }

        .modal .color-swatch .check {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            opacity: 0;
            transition: opacity var(--transition);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        .modal .color-swatch.active .check {
            opacity: 1;
        }

        /* ----- Список истории ----- */
        .history-list {
            flex: 1;
            overflow-y: auto;
            margin: 8px 0 12px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .history-item:hover {
            background: var(--bg-input);
            border-color: var(--theme);
        }

        .history-item .info {
            flex: 1;
            overflow: hidden;
        }

        .history-item .info .time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .history-item .info .preview {
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all var(--transition);
            line-height: 1;
        }

        .history-item .delete-btn:hover {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.15);
        }

        .history-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 14px;
        }

        /* ----- sources list ----- */
        .sources-list {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            border-left: 3px solid var(--theme);
        }

        .sources-list a {
            color: var(--theme);
            text-decoration: none;
        }
        .sources-list a:hover {
            text-decoration: underline;
        }

        /* ----- Адаптив ----- */
        @media (max-width: 600px) {
            #app {
                padding: 0 12px;
            }
            .brand {
                font-size: 17px;
            }
            .greeting-center .logo-ring {
                width: 90px;
                height: 90px;
                font-size: 36px;
            }
            .greeting-center .greeting-title {
                font-size: 18px;
            }
            .greeting-center .greeting-sub {
                font-size: 13px;
                max-width: 300px;
            }
            .message {
                max-width: 94%;
                padding: 8px 10px;
            }
            .message .bubble {
                font-size: 13.5px;
            }
            .input-row {
                padding: 4px 4px 4px 12px;
            }
            .input-row textarea {
                font-size: 13.5px;
                padding: 8px 0;
            }
            .toolbar .toggle-btn {
                font-size: 12px;
                padding: 4px 10px 4px 8px;
            }
            .toolbar .action-btn {
                font-size: 12px;
                padding: 4px 10px 4px 8px;
            }
            .modal {
                padding: 24px 20px 20px;
                margin: 0 12px;
            }
            .modal .color-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 6px;
            }
        }

        @media (max-width: 400px) {
            .brand {
                font-size: 15px;
            }
            .header-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .greeting-center .logo-ring {
                width: 72px;
                height: 72px;
                font-size: 28px;
            }
            .toolbar .toggle-btn .label {
                display: none;
            }
            .toolbar .toggle-btn {
                padding: 4px 8px;
            }
            .toolbar .action-btn .label {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="brand">OUTPUTEX <span>AI 2</span></div>
            </div>
            <div class="header-right">
                <button class="header-btn" id="settingsBtn" title="Настройки">
                    <span>⚙</span>
                </button>
            </div>
        </header>

        <!-- CHAT AREA -->
        <div class="chat-area" id="chatArea">
            <!-- Greeting -->
            <div class="greeting-center" id="greeting">
                <div class="logo-ring" id="logoRing">AI</div>
                <div class="greeting-title">Привет, я искусственный интеллект</div>
                <div class="greeting-sub">
                    <strong>OUTPUTEX AI 2</strong> &mdash; задавай любой вопрос,
                    а я попытаюсь на него ответить.
                </div>
                <div class="today-badge" id="todayBadge">Сегодня</div>
            </div>
            <!-- messages will be appended here -->
        </div>

        <!-- INPUT AREA -->
        <div class="input-area">
            <div class="input-row">
                <textarea id="messageInput" rows="1" placeholder="Напишите сообщение..." spellcheck="false"></textarea>
                <button class="send-btn" id="sendBtn" title="Отправить">➤</button>
            </div>

            <div class="toolbar">
                <div class="toggle-group">
                    <button class="toggle-btn" id="searchToggle" title="Поиск в интернете">
                        <span class="icon">🌐</span>
                        <span class="label">Поиск</span>
                    </button>
                    <button class="toggle-btn" id="deepToggle" title="Глубокое мышление">
                        <span class="icon">🗯</span>
                        <span class="label">Глубокое</span>
                    </button>
                </div>

                <button class="action-btn" id="newChatBtn">
                    <span class="icon">＋</span>
                    <span class="label">Новый чат</span>
                </button>

                <button class="action-btn" id="historyBtn">
                    <span class="icon">📜</span>
                    <span class="label">История</span>
                </button>
            </div>
        </div>

    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>Настройки темы</h2>
            <p class="modal-sub">Выберите основной цвет интерфейса</p>
            <div class="color-grid" id="colorGrid">
                <!-- swatches injected by JS -->
            </div>
            <button class="modal-close" id="modalClose">Закрыть</button>
        </div>
    </div>

    <!-- HISTORY MODAL -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <h2>📜 История чатов</h2>
            <p class="modal-sub">Нажмите на чат, чтобы загрузить его</p>
            <div class="history-list" id="historyList">
                <!-- элементы будут добавлены JS -->
            </div>
            <button class="modal-close" id="historyModalClose">Закрыть</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const COLORS = [
            { name: 'Белый', hex: '#f0f0f5', rgb: '240, 240, 245' },
            { name: 'Красный', hex: '#e74c3c', rgb: '231, 76, 60' },
            { name: 'Оранжевый', hex: '#f39c12', rgb: '243, 156, 18' },
            { name: 'Жёлтый', hex: '#f1c40f', rgb: '241, 196, 15' },
            { name: 'Зелёный', hex: '#2ecc71', rgb: '46, 204, 113' },
            { name: 'Голубой', hex: '#3498db', rgb: '52, 152, 219' },
            { name: 'Синий', hex: '#3f51b5', rgb: '63, 81, 181' },
            { name: 'Фиолетовый', hex: '#9b59b6', rgb: '155, 89, 182' },
            { name: 'Розовый', hex: '#e91e63', rgb: '233, 30, 99' },
            { name: 'Бирюзовый', hex: '#1abc9c', rgb: '26, 188, 156' },
            { name: 'Лайм', hex: '#a8e44a', rgb: '168, 228, 74' },
            { name: 'Пурпур', hex: '#8e44ad', rgb: '142, 68, 173' },
        ];

        const DEFAULT_COLOR = COLORS[5]; // Голубой

        // ============================================================
        //  STATE
        // ============================================================
        let currentTheme = DEFAULT_COLOR;
        let messages = [];
        let isSearchEnabled = false;
        let isDeepEnabled = false;
        let isWaiting = false;
        let chatHistory = [];

        // DOM refs
        const chatArea = document.getElementById('chatArea');
        const greeting = document.getElementById('greeting');
        const logoRing = document.getElementById('logoRing');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const modalClose = document.getElementById('modalClose');
        const colorGrid = document.getElementById('colorGrid');
        const searchToggle = document.getElementById('searchToggle');
        const deepToggle = document.getElementById('deepToggle');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyBtn = document.getElementById('historyBtn');
        const todayBadge = document.getElementById('todayBadge');

        // History modal refs
        const historyModal = document.getElementById('historyModal');
        const historyModalClose = document.getElementById('historyModalClose');
        const historyList = document.getElementById('historyList');

        // ============================================================
        //  THEME
        // ============================================================
        function applyTheme(color) {
            const hex = color.hex;
            const rgb = color.rgb;
            document.documentElement.style.setProperty('--theme', hex);
            document.documentElement.style.setProperty('--theme-rgb', rgb);
            document.documentElement.style.setProperty('--theme-glow', `rgba(${rgb}, 0.25)`);
            currentTheme = color;
            logoRing.style.background = hex;
            document.querySelector('.brand').style.color = hex;
            document.querySelectorAll('.message .avatar').forEach(el => {
                if (el.closest('.message.assistant')) {
                    el.style.background = hex;
                }
            });
            document.querySelectorAll('.toggle-btn.active').forEach(el => {
                el.style.background = hex;
                el.style.boxShadow = `0 0 20px rgba(${rgb}, 0.25)`;
            });
            sendBtn.style.background = hex;
            sendBtn.style.boxShadow = `0 0 24px rgba(${rgb}, 0.2)`;
            document.querySelectorAll('.badge').forEach(el => {
                el.style.background = hex;
            });
            document.querySelectorAll('.color-swatch').forEach(el => {
                const h = el.dataset.hex;
                el.classList.toggle('active', h === hex);
            });
            try {
                localStorage.setItem('outputex-theme', JSON.stringify(color));
            } catch (_) {}
        }

        function buildColorGrid() {
            colorGrid.innerHTML = '';
            COLORS.forEach(c => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch' + (c.hex === currentTheme.hex ? ' active' : '');
                swatch.style.background = c.hex;
                swatch.dataset.hex = c.hex;
                swatch.dataset.index = COLORS.indexOf(c);
                const check = document.createElement('span');
                check.className = 'check';
                check.textContent = '✓';
                swatch.appendChild(check);
                swatch.addEventListener('click', () => {
                    applyTheme(c);
                    setTimeout(() => closeModal(settingsModal), 180);
                });
                colorGrid.appendChild(swatch);
            });
        }

        function openModal(modal) {
            modal.classList.add('open');
        }

        function closeModal(modal) {
            modal.classList.remove('open');
        }

        settingsBtn.addEventListener('click', () => openModal(settingsModal));
        modalClose.addEventListener('click', () => closeModal(settingsModal));
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeModal(settingsModal);
        });

        // ============================================================
        //  HISTORY MODAL
        // ============================================================
        function openHistory() {
            renderHistoryList();
            openModal(historyModal);
        }

        historyBtn.addEventListener('click', openHistory);
        historyModalClose.addEventListener('click', () => closeModal(historyModal));
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) closeModal(historyModal);
        });

        // ============================================================
        //  РАБОТА С ХРАНИЛИЩЕМ ЧАТОВ
        // ============================================================
        function getSavedChats() {
            try {
                const data = localStorage.getItem('outputex-chats');
                return data ? JSON.parse(data) : [];
            } catch (_) {
                return [];
            }
        }

        function saveChats(chats) {
            try {
                localStorage.setItem('outputex-chats', JSON.stringify(chats));
            } catch (_) {}
        }

        // Сохранить текущий чат (если есть сообщения)
        function saveCurrentChat() {
            if (messages.length === 0) return;
            const chats = getSavedChats();
            const chat = {
                id: Date.now(),
                timestamp: new Date().toLocaleString('ru-RU'),
                messages: JSON.parse(JSON.stringify(messages)), // копия
                preview: messages[0]?.content?.slice(0, 60) || 'Диалог'
            };
            chats.unshift(chat); // новый сверху
            saveChats(chats);
        }

        // Загрузить чат по id
        function loadChat(id) {
            const chats = getSavedChats();
            const chat = chats.find(c => c.id === id);
            if (!chat) return;
            // Очищаем текущие сообщения
            messages = [];
            chatHistory = [];
            document.querySelectorAll('.message').forEach(el => el.remove());
            greeting.style.display = 'none';
            // Восстанавливаем сообщения
            chat.messages.forEach(msg => {
                addMessage(msg.role, msg.content);
                messages.push(msg);
                chatHistory.push(msg);
            });
            closeModal(historyModal);
        }

        // Удалить чат
        function deleteChat(id) {
            let chats = getSavedChats();
            chats = chats.filter(c => c.id !== id);
            saveChats(chats);
            renderHistoryList(); // обновить список
        }

        // Отрендерить список в модале
        function renderHistoryList() {
            const chats = getSavedChats();
            historyList.innerHTML = '';
            if (chats.length === 0) {
                historyList.innerHTML = '<div class="history-empty">У вас пока нет сохранённых чатов</div>';
                return;
            }
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'history-item';
                const info = document.createElement('div');
                info.className = 'info';
                const time = document.createElement('div');
                time.className = 'time';
                time.textContent = chat.timestamp || 'Без даты';
                const preview = document.createElement('div');
                preview.className = 'preview';
                preview.textContent = chat.preview || 'Диалог';
                info.appendChild(time);
                info.appendChild(preview);
                const del = document.createElement('button');
                del.className = 'delete-btn';
                del.textContent = '✕';
                del.title = 'Удалить чат';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                });
                item.appendChild(info);
                item.appendChild(del);
                item.addEventListener('click', () => loadChat(chat.id));
                historyList.appendChild(item);
            });
        }

        // ============================================================
        //  TOGGLES
        // ============================================================
        function toggleSearch() {
            isSearchEnabled = !isSearchEnabled;
            searchToggle.classList.toggle('active', isSearchEnabled);
            if (isSearchEnabled) {
                searchToggle.style.background = currentTheme.hex;
                searchToggle.style.boxShadow = `0 0 20px rgba(${currentTheme.rgb}, 0.25)`;
                searchToggle.style.color = '#fff';
            } else {
                searchToggle.style.background = 'transparent';
                searchToggle.style.boxShadow = 'none';
                searchToggle.style.color = '';
            }
        }

        function toggleDeep() {
            isDeepEnabled = !isDeepEnabled;
            deepToggle.classList.toggle('active', isDeepEnabled);
            if (isDeepEnabled) {
                deepToggle.style.background = currentTheme.hex;
                deepToggle.style.boxShadow = `0 0 20px rgba(${currentTheme.rgb}, 0.25)`;
                deepToggle.style.color = '#fff';
            } else {
                deepToggle.style.background = 'transparent';
                deepToggle.style.boxShadow = 'none';
                deepToggle.style.color = '';
            }
        }

        searchToggle.addEventListener('click', toggleSearch);
        deepToggle.addEventListener('click', toggleDeep);

        // ============================================================
        //  NEW CHAT (с сохранением текущего)
        // ============================================================
        function resetChat() {
            // Сохраняем текущий чат перед очисткой
            if (messages.length > 0) {
                saveCurrentChat();
            }
            messages = [];
            chatHistory = [];
            document.querySelectorAll('.message').forEach(el => el.remove());
            greeting.style.display = 'flex';
            messageInput.value = '';
            messageInput.style.height = 'auto';
            chatArea.scrollTop = 0;
            messageInput.focus();
            updateToday();
        }

        newChatBtn.addEventListener('click', resetChat);

        // ============================================================
        //  SEND MESSAGE
        // ============================================================
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isWaiting) return;

            greeting.style.display = 'none';

            addMessage('user', text);
            messages.push({ role: 'user', content: text });
            chatHistory.push({ role: 'user', content: text });

            messageInput.value = '';
            messageInput.style.height = 'auto';
            isWaiting = true;
            sendBtn.disabled = true;

            const typingId = addTypingIndicator();

            const payload = {
                message: text,
                history: chatHistory.slice(0, -1),
                search: isSearchEnabled,
                deep: isDeepEnabled,
            };

            const API_URL = '/api/chat';

            fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    removeTypingIndicator(typingId);
                    const reply = data.reply || 'Нет ответа от сервера.';
                    addMessage('assistant', reply);
                    if (data.sources && data.sources.length) {
                        const sourceDiv = document.createElement('div');
                        sourceDiv.className = 'sources-list';
                        sourceDiv.innerHTML = '📎 Источники: ' + data.sources.map(s =>
                            `<a href="${s.url}" target="_blank">${s.title}</a>`
                        ).join(' | ');
                        const lastMsg = document.querySelector('.message.assistant:last-child');
                        if (lastMsg) {
                            lastMsg.appendChild(sourceDiv);
                        }
                    }
                    messages.push({ role: 'assistant', content: reply });
                    chatHistory.push({ role: 'assistant', content: reply });
                })
                .catch(err => {
                    removeTypingIndicator(typingId);
                    const fallback = '⚠️ Ошибка соединения с сервером. Проверьте, запущен ли app.py.';
                    addMessage('assistant', fallback);
                    messages.push({ role: 'assistant', content: fallback });
                    chatHistory.push({ role: 'assistant', content: fallback });
                    console.error('API error:', err);
                })
                .finally(() => {
                    isWaiting = false;
                    sendBtn.disabled = false;
                    chatArea.scrollTop = chatArea.scrollHeight;
                    messageInput.focus();
                });

            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ============================================================
        //  DOM HELPERS
        // ============================================================
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'U' : 'AI';
            if (role === 'assistant') {
                avatar.style.background = currentTheme.hex;
            }
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = formatText(content);
            div.appendChild(avatar);
            div.appendChild(bubble);
            if (greeting.style.display !== 'none') {
                chatArea.insertBefore(div, greeting);
            } else {
                chatArea.appendChild(div);
            }
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function formatText(text) {
            let html = text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code style="background:var(--bg-input);padding:1px 6px;border-radius:4px;font-size:0.9em;">$1</code>')
                .replace(/\n/g, '<br>');
            return html;
        }

        let typingCounter = 0;

        function addTypingIndicator() {
            const id = ++typingCounter;
            const div = document.createElement('div');
            div.className = 'message assistant typing-indicator';
            div.dataset.typingId = id;
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'AI';
            avatar.style.background = currentTheme.hex;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const dots = document.createElement('div');
            dots.className = 'typing-dots';
            for (let i = 0; i < 3; i++) {
                const span = document.createElement('span');
                dots.appendChild(span);
            }
            bubble.appendChild(dots);
            div.appendChild(avatar);
            div.appendChild(bubble);
            if (greeting.style.display !== 'none') {
                chatArea.insertBefore(div, greeting);
            } else {
                chatArea.appendChild(div);
            }
            chatArea.scrollTop = chatArea.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            document.querySelectorAll(`.typing-indicator[data-typing-id="${id}"]`).forEach(el => el.remove());
        }

        // ============================================================
        //  INPUT EVENTS
        // ============================================================
        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        // ============================================================
        //  UPDATE TODAY
        // ============================================================
        function updateToday() {
            const now = new Date();
            const opts = { day: 'numeric', month: 'long', year: 'numeric' };
            const dateStr = now.toLocaleDateString('ru-RU', opts);
            todayBadge.textContent = `Сегодня, ${dateStr}`;
        }

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            // Тема
            try {
                const saved = localStorage.getItem('outputex-theme');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const found = COLORS.find(c => c.hex === parsed.hex);
                    if (found) {
                        applyTheme(found);
                    } else {
                        applyTheme(DEFAULT_COLOR);
                    }
                } else {
                    applyTheme(DEFAULT_COLOR);
                }
            } catch (_) {
                applyTheme(DEFAULT_COLOR);
            }

            buildColorGrid();
            updateToday();
            messageInput.focus();

            if (isSearchEnabled) {
                searchToggle.classList.add('active');
                searchToggle.style.background = currentTheme.hex;
                searchToggle.style.boxShadow = `0 0 20px rgba(${currentTheme.rgb}, 0.25)`;
                searchToggle.style.color = '#fff';
            }
            if (isDeepEnabled) {
                deepToggle.classList.add('active');
                deepToggle.style.background = currentTheme.hex;
                deepToggle.style.boxShadow = `0 0 20px rgba(${currentTheme.rgb}, 0.25)`;
                deepToggle.style.color = '#fff';
            }

            // Если есть сохранённые чаты – обновим счётчик (опционально)
        }

        // Закрываем модалы по Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (settingsModal.classList.contains('open')) closeModal(settingsModal);
                if (historyModal.classList.contains('open')) closeModal(historyModal);
            }
        });

        init();
        console.log('🚀 OUTPUTEX AI 2 с историей готов');
    </script>
</body>
</html>
